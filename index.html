
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>omise | salon</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fffdfd;
      color: #f05298;
      font-family: Georgia, "Yu Mincho", serif;
    }

    main {
  width: 100%;
  margin: 0;
  padding: 35px 0 60px 40px;
}

main > section {
  width: 420px;
  max-width: 100%;
}

header {
  text-align: left;
  margin-bottom: 65px;
}

section {
  margin-bottom: 38px;
}

h2 {
  font-size: 20px;
  margin-bottom: 12px;
}

p {
  font-size: 13px;
  line-height: 1.8;
}

.menu-item {
  max-width: 260px;
  font-size: 15px;
  margin: 7px 0;
}

.links a {
  font-size: 16px;

}

  font-size: 20px;
}

  font-size: 11px;
}
    
    header {
      text-align: left;
      margin-bottom: 65px;
    }

    .logo {
      font-size: clamp(54px, 12vw, 88px);
      font-weight: bold;
      font-style: italic;
      letter-spacing: 2px;
      margin: 0;
    }

    section {
      margin: 0 0 55px;
    }

    h2 {
      font-size: 27px;
      font-style: italic;
      margin-bottom: 20px;
    }

    p {
      line-height: 1.9;
    }

    .photo {
      width: 270px;
      max-width: 100%;
      min-height: 150px;
      background: #efd0d8;
      color: #222;
      display: grid;
      place-items: center;
      text-align: center;
      font-family: sans-serif;
      font-weight: bold;
      padding: 20px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      max-width: 340px;
      margin: 8px 0;
      font-size: 20px;
      font-weight: bold;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.65;
    }

    .links a {
      display: block;
      font-size: 21px;
      font-weight: bold;
      text-decoration: underline;
      margin: 8px 0;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .profile .photo {
      width: 145px;
      min-height: 145px;
    }

    .real-link {
      display: inline-block;
      font-size: 25px;
      font-weight: bold;
      font-style: italic;
      color: #f05298;
      cursor: pointer;
    }

    .real-post {
      padding: 0 0 18px;
      margin: 18px 0;
      border-bottom: 1px dashed #e8a6c0;
      color: #55454d;
      overflow-wrap: anywhere;
    }

    .real-post time {
      font-size: 13px;
      color: #997985;
    }

    .real-post p {
      white-space: pre-wrap;
      margin-bottom: 0;
    }

    footer {
      margin-top: 55px;
      font-size: 14px;
    }

    .payment {
      margin-top: 70px;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      main {
        width: calc(100% - 36px);
        padding: 25px 0 50px 18px;
      }

      header {
        margin-bottom: 45px;
      }
    }
  /* スマホ表示を参考画像に寄せる */
@media (max-width: 600px) {
  main {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 20px 0 40px 24px !important;
  }

  header {
    width: 300px !important;
    max-width: calc(100vw - 48px) !important;
    text-align: left !important;
    margin-bottom: 45px !important;
  }

  .logo {
    font-size: 54px !important;
  }

  main > section {
    width: 300px !important;
    max-width: calc(100vw - 48px) !important;
    margin: 0 0 32px !important;
  }

  h2 {
    font-size: 17px !important;
    margin-bottom: 10px !important;
  }

  p {
    font-size: 11px !important;
    line-height: 1.7 !important;
  }

  .photo {
    width: 180px !important;
    min-height: 100px !important;
    font-size: 12px !important;
  }

  .menu-item {
    width: 155px !important;
    max-width: 155px !important;
    justify-content: flex-start !important;
    gap: 12px !important;
    font-size: 13px !important;
    margin: 5px 0 !important;
  }

  .links a {
    font-size: 14px !important;
    margin: 5px 0 !important;
  }

  .profile {
    gap: 12px !important;
    font-size: 11px !important;
  }

  .profile .photo {
    width: 90px !important;
    min-height: 90px !important;
  }

  .real-link {
    font-size: 16px !important;
  }

  footer {
    font-size: 10px !important;
  }
}
  </style>
</head>

</html>
